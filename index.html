let current='home', flashIdx=0, score={};
function tab(id,label){return `<button class="tab ${current===id?'active':''}" onclick="go('${id}')">${label}</button>`}
function go(id){current=id;render();scrollTo(0,0)}
function render(){document.getElementById('tabs').innerHTML=[['home','דשבורד'],['learn','לימוד'],['types','זיהוי שאלות'],['formulas','נוסחאות לשינון'],['practice','תרגול'],['exams','מפת מבחנים'],['plan','תוכנית עד שישי']].map(x=>tab(...x)).join('');document.getElementById('main').innerHTML=views[current](); bind();}
function topicCard(t){return `<details><summary><span class="badge">${t.p}</span>${t.name}</summary><div class="body"><div class="note info"><b>איך מזהים?</b> ${t.recognize}</div><h3>הגדרות</h3><ul>${t.defs.map(x=>`<li>${x}</li>`).join('')}</ul><h3>נוסחאות</h3>${t.formulas.map(x=>`<div class="formula">${x}</div>`).join('')}<h3>מתכון פתרון</h3><ol class="steps">${t.recipe.map(x=>`<li>${x}</li>`).join('')}</ol><label class="checkrow"><input type="checkbox" class="master" data-id="${t.id}"><span><b>שלטתי בנושא הזה בלי להציץ</b><br><span class="small muted">סימון נשמר בדפדפן.</span></span></label></div></details>`}
const views={
home:()=>`<section class="hero"><div class="small">מלווה בחינה אישי · ADHD friendly</div><h1>להבין, לזהות ולפתור את כל צורות השאלות</h1><p>האפליקציה בנויה מהמצגות, חוברת התרגילים וחמש בחינות לדוגמה/עבר עם פתרונות. היא מתמקדת במה שחוזר בפועל, מלמדת בשכבות קצרות ומכריחה שליפה פעילה של נוסחאות.</p><div class="stats"><div class="stat"><b>11</b>יחידות קורס</div><div class="stat"><b>5×25</b>מבנה הבחינה האחרון</div><div class="stat"><b>15</b>נוסחאות ליבה</div><div class="stat"><b id="doneStat">0%</b>התקדמות</div></div></section>
<div class="section grid g3"><div class="panel priority-high"><h3>עדיפות 1</h3><p><b>תכנון ליניארי + ניתוח רגישות</b></p><p class="muted">שניהם הופיעו בכל אחת מהבחינות האחרונות שנבדקו.</p><button class="btn primary" onclick="go('learn')">ללמוד עכשיו</button></div><div class="panel priority-med"><h3>עדיפות 2</h3><p><b>CPM / PERT / Crashing + סימולציה</b></p><p class="muted">אחד או יותר מהם מופיע כמעט בכל מועד.</p><button class="btn ghost" onclick="go('types')">לזהות צורות</button></div><div class="panel priority-low"><h3>עדיפות 3</h3><p><b>החלטות, עצים, משחקים, שלמים</b></p><p class="muted">נושאים מתחלפים, אך כל אחד יכול להיות שאלה של 25 נקודות.</p><button class="btn ghost" onclick="go('practice')">לתרגל</button></div></div>
<div class="section grid g2"><div class="panel focusbox"><h2>ספרינט ריכוז</h2><p class="muted">25 דקות עבודה, 5 דקות הפסקה.</p><div class="timer" id="timer">25:00</div><div class="chips" style="justify-content:center"><button class="btn primary" onclick="timerStart()">התחלה</button><button class="btn ghost" onclick="timerReset()">איפוס</button></div></div><div class="panel"><h2>איך לעבוד עם האפליקציה</h2><ol class="steps"><li>פתחי נושא אחד בלבד וקראי את “איך מזהים”.</li><li>כתבי את הנוסחאות מהזיכרון לפני החשיפה.</li><li>פתרי 3 שאלות מאותו סוג.</li><li>סמני שליטה רק אם הצלחת בלי עזרה.</li></ol></div></div>`,
learn:()=>`<div class="section-title"><span class="idx">01</span><h1>לימוד לפי נושאים</h1></div><p class="muted">כל יחידה: סימני זיהוי → הגדרות → נוסחאות → מתכון פתרון.</p>${topics.map(topicCard).join('')}`,
types:()=>`<div class="section-title"><span class="idx">02</span><h1>מזהה השאלות</h1></div><div class="note key"><b>המטרה:</b> בתוך 20–30 שניות לזהות את “צורת” השאלה ולהפעיל מתכון קבוע.</div><div class="grid g2">${topics.map(t=>`<div class="panel"><span class="badge">${t.p}</span><h2>${t.name}</h2><p>${t.recognize}</p><h3>הפעולה הראשונה</h3><p><b>${t.recipe[0]}</b></p><button class="btn ghost" onclick="go('learn')">פתחי את המתכון המלא</button></div>`).join('')}</div>`,
formulas:()=>`<div class="section-title"><span class="idx">03</span><h1>נוסחאות לשינון</h1></div><div class="note warn"><b>אין דף נוסחאות בבחינה.</b> אל תסתפקי בזיהוי. כתבי כל נוסחה מדף ריק, הסבירי כל סימן, ואז בדקי.</div><div class="grid g2">${formulas.map((f,i)=>`<div class="panel memory-card"><div class="small muted">${f[0]}</div><button class="btn ghost reveal" data-i="${i}">חשיפת נוסחה</button><div class="hidden fbody"><div class="formula">${f[1]}</div><p>${f[2]}</p><label class="checkrow"><input type="checkbox" class="formulaCheck" data-id="f${i}"><span>כתבתי נכון מהזיכרון</span></label></div></div>`).join('')}</div><div class="section panel"><h2>כרטיסיות שליפה</h2><div class="flash" id="flash" onclick="flipFlash()"><div class="front">${flash[0][0]}<div class="small muted">לחצי כדי להפוך</div></div><div class="back">${flash[0][1]}</div></div><div class="chips" style="justify-content:center"><button class="btn ghost" onclick="nextFlash(-1)">הקודם</button><button class="btn primary" onclick="nextFlash(1)">הבא</button></div></div>`,
practice:()=>`<div class="section-title"><span class="idx">04</span><h1>תרגול אינטראקטיבי</h1></div><div class="chips" id="qchips"><button class="chip on" data-filter="all">הכול</button>${topics.map(t=>`<button class="chip" data-filter="${t.id}">${t.name}</button>`).join('')}</div><div id="qbank">${renderQs('all')}</div><div class="section panel generator"><h2>מחולל שאלה דומה</h2><p class="muted">המחולל עובד מקומית לפי תבניות הקורס, ללא חיבור חיצוני.</p><label>נושא</label><select id="genTopic">${topics.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select><button class="btn primary" style="margin-top:12px" onclick="generateQ()">צרי שאלה חדשה</button><div id="generated"></div></div>`,
exams:()=>`<div class="section-title"><span class="idx">05</span><h1>מפת הבחינות והנתונים שחולצו</h1></div><div class="note info"><b>ממצא מרכזי:</b> במועדי 2026 הבחינה בנויה מ-5 שאלות, 25 נקודות כל אחת. תכנון ליניארי וניתוח רגישות תופסים יחד 50% מהציון.</div><div class="panel tablewrap"><table><thead><tr><th>בחינה</th><th>שאלה 1</th><th>שאלה 2</th><th>שאלה 3</th><th>שאלה 4</th><th>שאלה 5</th></tr></thead><tbody>${examData.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="section grid g3"><div class="panel"><h3>שאלות חישוב</h3><p>דורשות הצגת דרך: PERT, CPM, סימולציה, תוחלות, בייס ורגישות.</p></div><div class="panel"><h3>שאלות ניסוח</h3><p>הגדרת משתנים, פונקציית מטרה, אילוצים והסבר מילולי. לעיתים אין צורך לפתור.</p></div><div class="panel"><h3>שאלות פרשנות</h3><p>מה ניתן להסיק מדו״ח Solver ומה לא; אילוצים הדוקים; תחומי יציבות; משמעות כלכלית.</p></div></div><div class="section note key"><b>סגנון הבדיקה:</b> במסמכי הבחינה מודגש שרוב הנקודות ניתנות על הדרך ולא רק על התוצאה. לכן בכל פתרון כתבי נוסחה, הצבה, תוצאה ומשפט מסקנה.</div><p class="source">מקורות: 55945 2024B מועדים א׳–ב׳, 55945 2025A מועד ב׳, Exam 55945 2026 מועדים א׳–ב׳ והפתרונות שצורפו.</p>`,
plan:()=>`<div class="section-title"><span class="idx">06</span><h1>תוכנית לימוד עד יום שישי</h1></div><div class="note good"><b>עיקרון ADHD:</b> לא “ללמוד נושא” במשך שעות. כל בלוק הוא 25 דקות עם תוצר מוחשי.</div><div class="grid g2"><div class="panel"><h2>היום</h2><label class="checkrow"><input type="checkbox" class="plan"><span>2 ספרינטים: ניסוח LP, כולל שתי בעיות מלאות</span></label><label class="checkrow"><input type="checkbox" class="plan"><span>2 ספרינטים: ניתוח רגישות וקריאת דו״ח</span></label><label class="checkrow"><input type="checkbox" class="plan"><span>ספרינט אחד: כתיבת נוסחאות PERT/CPM מדף ריק</span></label><label class="checkrow"><input type="checkbox" class="plan"><span>15 דקות: כרטיסיות הגדרות</span></label></div><div class="panel"><h2>יום חמישי</h2><label class="checkrow"><input type="checkbox" class="plan"><span>סימולציה מלאה אחת עם טבלת תור</span></label><label class="checkrow"><input type="checkbox" class="plan"><span>עץ החלטה אחד + בייס + מחיר מידע</span></label><label class="checkrow"><input type="checkbox" class="plan"><span>CPM/PERT/Crashing: שאלה אחת מלאה</span></label><label class="checkrow"><input type="checkbox" class="plan"><span>תורת משחקים + תכנות בשלמים: זיהוי ותרגיל קצר</span></label><label class="checkrow"><input type="checkbox" class="plan"><span>סימולציית בחינה של 125 דקות ללא חומר</span></label></div><div class="panel"><h2>שישי לפני הבחינה</h2><label class="checkrow"><input type="checkbox" class="plan"><span>כתיבת כל 15 נוסחאות מהזיכרון</span></label><label class="checkrow"><input type="checkbox" class="plan"><span>מעבר על טעויות בלבד, לא חומר חדש</span></label><label class="checkrow"><input type="checkbox" class="plan"><span>קריאת מזהה השאלות במשך 15 דקות</span></label><label class="checkrow"><input type="checkbox" class="plan"><span>מים, אוכל, מחשבון וציוד</span></label></div><div class="panel"><h2>פרוטוקול לכל שאלה בבחינה</h2><ol class="steps"><li>סמני את סוג השאלה.</li><li>כתבי את הנוסחה או מבנה המודל.</li><li>הציבי נתונים עם יחידות.</li><li>בדקי סימן, הסתברות וסבירות.</li><li>כתבי משפט מסקנה בעברית.</li></ol></div></div>`};
function renderQs(f){return questions.map((q,i)=>({q,i})).filter(x=>f==='all'||x.q.t===f).map(({q,i})=>`<div class="panel q" id="q${i}"><div class="small muted">${topics.find(t=>t.id===q.t).name}</div><div class="qstem">${q.q}</div>${q.o.map((o,j)=>`<button class="opt" onclick="answer(${i},${j})">${String.fromCharCode(1488+j)}. ${o}</button>`).join('')}<div class="explain">${q.e}</div></div>`).join('')}
function answer(i,j){const c=document.getElementById('q'+i);if(c.dataset.done)return;c.dataset.done=1;[...c.querySelectorAll('.opt')].forEach((b,k)=>b.classList.add(k===questions[i].a?'correct':(k===j?'wrong':'')));c.querySelector('.explain').classList.add('show');score[i]=j===questions[i].a;localStorage.qmScore=JSON.stringify(score)}
function bind(){document.querySelectorAll('#qchips .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#qchips .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('qbank').innerHTML=renderQs(b.dataset.filter)});document.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>b.nextElementSibling.classList.toggle('hidden'));document.querySelectorAll('.master,.formulaCheck,.plan').forEach((x,i)=>{const key='qm_'+(x.dataset.id||current+'_'+i);x.checked=localStorage.getItem(key)==='1';x.onchange=()=>{localStorage.setItem(key,x.checked?'1':'0');updateDone()}});updateDone()}
function updateDone(){const total=topics.length+formulas.length;let n=0;topics.forEach(t=>n+=localStorage.getItem('qm_'+t.id)==='1');formulas.forEach((_,i)=>n+=localStorage.getItem('qm_f'+i)==='1');const p=Math.round(100*n/total);const e=document.getElementById('doneStat');if(e)e.textContent=p+'%'}
function flipFlash(){document.getElementById('flash').classList.toggle('flipped')}
function nextFlash(d){flashIdx=(flashIdx+d+flash.length)%flash.length;const f=document.getElementById('flash');f.classList.remove('flipped');f.innerHTML=`<div class="front">${flash[flashIdx][0]}<div class="small muted">לחצי כדי להפוך</div></div><div class="back">${flash[flashIdx][1]}</div>`}
const genTemplates={decision:()=>{let a=40+Math.floor(Math.random()*6)*10,b=a+20+Math.floor(Math.random()*5)*10;return {q:`התוחלת הטובה ביותר ללא מידע היא ${a}, ועם מידע מושלם היא ${b}. חשבי EVPI.`,ans:`EVPI=${b}−${a}=${b-a}.`}},trees:()=>({q:'בדיקה החזירה אות חיובי. כתבי את נוסחת בייס לעדכון ההסתברות למצב S.',ans:'P(S|G)=P(G|S)P(S)/[P(G|S)P(S)+P(G|W)P(W)].'}),lp:()=>({q:'נסחי אילוץ: לפחות מחצית מהתקציב הכולל תושקע באפיקים A ו-B.',ans:'A+B ≥ 0.5(A+B+C+...).'}),sensitivity:()=>{let z=800+Math.floor(Math.random()*5)*100,sp=5+Math.floor(Math.random()*6),d=2+Math.floor(Math.random()*8);return {q:`ערך המטרה ${z}, מחיר הצל ${sp}, וה-RHS גדל ב-${d} בתוך התחום המותר. מהו הערך החדש?`,ans:`${z}+${sp}·${d}=${z+sp*d}.`}},integer:()=>({q:'נסחי: אם בוחרים בפרויקט A, חובה לבחור גם ב-B; אבל אפשר לבחור B בלי A.',ans:'A≤B, כאשר A,B בינאריים.'}),cpm:()=>{let es=Math.floor(Math.random()*10),d=3+Math.floor(Math.random()*8),sl=1+Math.floor(Math.random()*5);return {q:`לפעילות ES=${es}, משך=${d}, רזרבה=${sl}. מצאי EF ו-LS.`,ans:`EF=${es+d}; LS=${es+sl}.`}},pert:()=>{let a=1+Math.floor(Math.random()*4),m=a+3,b=m+3;return {q:`PERT: a=${a}, m=${m}, b=${b}. חשבי תוחלת ושונות.`,ans:`tₑ=(${a}+4·${m}+${b})/6=${(a+4*m+b)/6}; Var=((${b}-${a})/6)²=${(((b-a)/6)**2).toFixed(2)}.`}},sim:()=>{let ar=(5+Math.random()*5).toFixed(2),end=(+ar+1+Math.random()*4).toFixed(2);return {q:`לקוח הגיע ב-${ar}; השרת מתפנה ב-${end}. מה זמן ההמתנה?`,ans:`${end}−${ar}=${(+end-+ar).toFixed(2)}.`}},game:()=>({q:'במטריצת משחק, תא מסומן כתגובה מיטבית לשחקן השורות וגם לשחקן העמודות. מה מסיקים?',ans:'זהו שיווי משקל נאש באסטרטגיות טהורות.'})};
function generateQ(){const t=document.getElementById('genTopic').value,x=genTemplates[t]();document.getElementById('generated').innerHTML=`<div class="note info"><b>שאלה:</b> ${x.q}<br><button class="btn ghost" style="margin-top:10px" onclick="this.nextElementSibling.classList.toggle('hidden')">פתרון</button><div class="hidden"><p><b>${x.ans}</b></p></div></div>`}
let timerInt=null,seconds=1500;function timerStart(){if(timerInt)return;timerInt=setInterval(()=>{seconds--;drawTimer();if(seconds<=0){clearInterval(timerInt);timerInt=null;alert('הספרינט הסתיים. קומי להפסקה קצרה.')}},1000)}function timerReset(){clearInterval(timerInt);timerInt=null;seconds=1500;drawTimer()}function drawTimer(){const e=document.getElementById('timer');if(e)e.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function countdown(){const now=new Date(),exam=new Date('2026-07-31T09:00:00+03:00'),ms=exam-now,e=document.getElementById('countdown');if(!e)return;if(ms<=0)e.textContent='בהצלחה!';else{const h=Math.floor(ms/36e5),m=Math.floor((ms%36e5)/6e4);e.textContent=`${h} שעות ו-${m} דקות`}}setInterval(countdown,60000);countdown();
try{score=JSON.parse(localStorage.qmScore||'{}')}catch(e){}render();
